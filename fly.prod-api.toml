# fly.toml for Notipo API (Fastify backend, pg-boss job queue)
# Deploy: flyctl deploy -c fly.prod-api.toml --remote-only
#
# Org: furas-digital · Region: ams (Amsterdam)
# See FLY-CHEATSHEET.md in notipo-site repo for app naming convention.

app = 'notipo-prod-api'
primary_region = 'ams'

[build]
  dockerfile = 'apps/api/Dockerfile'

# Run pending Prisma migrations in the release image (secrets injected, new code)
# before the app machines start. `prisma` is a runtime dependency so the CLI is
# present in the production image. A failed migration aborts the deploy and the
# current version keeps serving.
[deploy]
  # Disable Prisma's migrate advisory lock — Neon (via its proxy) does not grant
  # pg_advisory_lock within the 10s timeout, causing P1002. The lock only guards
  # against concurrent migrations, which can't happen here: Fly runs the release
  # command serially and CI uses `concurrency: deploy-api`.
  release_command = "sh -c 'cd /app/apps/api && PRISMA_SCHEMA_DISABLE_ADVISORY_LOCK=1 npx prisma migrate deploy'"

[env]
  NODE_ENV = 'production'
  PORT = '3000'
  # Public self-serve registration. config default is 'false' (safe for self-hosted),
  # so the SaaS prod app must enable it explicitly. Kept here (version-controlled) so
  # it survives redeploys/migrations — it was lost in the GCP→Fly move (Aug 2026).
  ALLOW_SIGNUP = 'true'
  # Sentry DSN is a public identifier — Sentry validates per-origin.
  # NEXT_PUBLIC_SENTRY_DSN and SENTRY_DSN set via secrets if needed.

[http_service]
  internal_port = 3000
  force_https = true
  # Must stay warm. This app has no public hostname of its own — the web app
  # reverse-proxies /api and /health to notipo-prod-api.internal:3000, and Fly's
  # private .internal DNS does not wake a stopped machine. Only the public proxy
  # (or a .flycast address) triggers auto_start, so min_machines_running = 0 here
  # takes the API down permanently rather than putting it to sleep. Verified the
  # hard way: with 0, every request through the web app returned 502 and the
  # machines never came back.
  #
  # Reaching zero here means giving this app a .flycast address first, or letting
  # it answer on its own hostname. Until then the compute cost belongs to
  # pg-boss's polling interval, which is the knob that actually controls it.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 100
    soft_limit = 50

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
