name: Publish CLI

# Publishes the `notipo` npm package via OIDC trusted publishing.
# Trigger by pushing a tag like `cli-v1.1.5` whose version matches
# packages/cli/package.json. No npm token or OTP needed — npm trusts
# this workflow through the trusted publisher configured on npmjs.com
# (kfuras/notipo-app → publish-cli.yml). Provenance is attached automatically.

on:
  push:
    tags: ["cli-v*"]

permissions:
  id-token: write # required for OIDC trusted publishing
  contents: read

jobs:
  publish:
    name: Publish notipo to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Ensure npm >= 11.5.1 (OIDC trusted publishing)
        run: npm install -g npm@latest

      - name: Verify tag matches packages/cli version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag_version="${TAG#cli-v}"
          pkg_version="$(node -p "require('./packages/cli/package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag $TAG implies version $tag_version but packages/cli/package.json is $pkg_version. Bump the package version to match the tag before pushing."
            exit 1
          fi
          echo "Publishing notipo@$pkg_version"

      - run: npm ci

      - run: npm run build -w packages/cli

      - name: Publish (OIDC trusted publishing, provenance auto)
        run: npm publish -w packages/cli
