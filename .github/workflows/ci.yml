name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".claude/**"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lockfile-check:
    name: Verify lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # A lockfile regenerated from scratch on macOS keeps only the host's own
      # platform packages. The build is where that surfaces, several minutes
      # later and as a confusing resolve error, so check it here instead.
      - name: Check for Linux native binaries
        run: |
          missing=""
          for pkg in \
            "@img/sharp-linuxmusl-x64" \
            "lightningcss-linux-x64-musl" \
            "@typescript/typescript-linux-x64"
          do
            grep -q "$pkg" package-lock.json || missing="$missing $pkg"
          done
          if [ -n "$missing" ]; then
            echo "::error::Lockfile is missing Linux binaries:$missing"
            echo "Do not delete package-lock.json. Restore it and update in place:"
            echo "  git checkout origin/main -- package-lock.json && npm install"
            exit 1
          fi
          echo "All platform binaries present in lockfile."

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - run: corepack enable
      - run: npm ci
      - run: npm run generate -w @notipo/api
      - run: npx turbo build
      - run: npx turbo test

  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      # Anything outside the two app directories counts as touching both, so a
      # shared package, the lockfile or this workflow still ships everywhere.
      # Only a change confined to one app skips the other's deploy.
      - id: filter
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          api=false
          web=false
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            api=true
            web=true
          else
            while IFS= read -r f; do
              case "$f" in
                "") ;;
                apps/api/*|fly.prod-api.toml) api=true ;;
                apps/web/*|fly.prod-web.toml) web=true ;;
                *) api=true; web=true ;;
              esac
            done <<< "$(git diff --name-only "$BEFORE" "$AFTER")"
          fi
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "api=$api web=$web"

  deploy-api:
    name: Deploy API to Fly
    needs: [build, lockfile-check, changes]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    concurrency: deploy-api
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      - name: Deploy API
        run: flyctl deploy -c fly.prod-api.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Ensure machines are running
        run: |
          set -euo pipefail
          stopped=$(flyctl machines list -a notipo-prod-api --json | jq -r '.[] | select(.state != "started") | .id')
          for id in $stopped; do
            echo "Starting machine $id"
            flyctl machine start "$id" -a notipo-prod-api
          done
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Smoke test
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 20 https://app.notipo.com/health || true)
            if [ "$code" = "200" ]; then
              echo "API healthy"
              exit 0
            fi
            echo "attempt $i: HTTP $code"
            sleep 10
          done
          echo "API did not return 200 after deploy"
          exit 1

  deploy-web:
    name: Deploy Web to Fly
    needs: [build, lockfile-check, changes]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    concurrency: deploy-web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      - name: Deploy Web
        run: flyctl deploy -c fly.prod-web.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
